# One real run against bbb.org. tests.yml (deliberately) never touches the
# site — see its own header.
#
# This canary is unusual for this family, and the reason is worth stating at
# the top: **the listing path needs no credentials at all**, so it really can
# run nightly from a bare GitHub runner and be green.
#
# BBB renders its listings out of its own JSON endpoint, and that endpoint is
# not behind Cloudflare. Measured 2026-09-16 from a datacenter VPS that gets
# HTTP 403 on every HTML page on the site: HTTP 200, 57 KB, 15 complete
# business records. A GitHub runner is a datacenter address too, which is
# exactly the case this proves.
#
# The PROFILE path is different — it fetches a Cloudflare-gated page — so that
# half is guarded on a secret and SKIPS with a ::notice:: when the secret is
# absent. A check that is always red teaches everyone to ignore checks
# (CLAUDE.md §11).
#
#     gh secret set BBB_CDP_ENDPOINT --repo 2scraper/bbb-scraper
#
# `secrets` is not available in a job-level `if`, so presence is tested
# through job `env` and read in each step's `if`.

name: canary

on:
  schedule:
    # 05:40 UTC. Not on the hour: every scheduled workflow on GitHub fires at
    # :00 and the queue there is long.
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing:
    name: listing (no credentials needed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      # >= 3 pages, because with one page pagination is never exercised —
      # which is exactly how a silent single-page bug survived in a sibling
      # repo (§11).
      - name: Run
        id: run
        run: |
          set +e   # GitHub runs `run:` under `bash -e`, and a non-zero exit
                   # would abort the step BEFORE the echo below.
          python playwright_scraper.py \
            --text restaurants --location "New York, NY" \
            --sort a-z --pages 3 --format both --out canary
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check what came back
        run: |
          python - <<'PY'
          import json, os, sys

          code = int(os.environ["EXIT_CODE"])
          if code != 0:
              print(f"::error::The run exited {code}.")
              # Interpret it rather than just failing: the codes mean
              # different things and only some of them are this repo's fault.
              print({
                  3: "Blocked (exit 3). BBB refused a GitHub runner's address "
                     "on the ENDPOINT, which has never happened in testing — "
                     "if this is real, the endpoint's access policy changed "
                     "and the README's central claim needs re-measuring.",
                  4: "Zero businesses (exit 4). Either the query genuinely "
                     "matches nothing now, or the payload shape moved.",
                  5: "Remote API error (exit 5) — nothing was tested.",
                  6: "Partial (exit 6): some pages came back and some did not.",
              }.get(code, "See the log."))
              sys.exit(1)

          meta = json.load(open("canary.meta.json"))
          rows = json.load(open("canary.json"))
          print(json.dumps(meta, indent=1))

          failures = []
          def want(label, ok, detail):
              if not ok:
                  failures.append(f"{label}: {detail}")

          want("status", meta["status"] == "complete", meta["status"])
          want("pages_completed", meta["pages_completed"] == 3,
               f'{meta["pages_completed"]} of 3')
          want("no failed pages", not meta["pages_failed"],
               str(meta["pages_failed"]))

          # BBB serves a FIXED 15 per page, so three pages is 45 and the floor
          # can sit close. Measured 2026-09-16: 15/15/15 on every listing page
          # captured, across two countries and three queries.
          want("row floor", len(rows) >= 40, f"{len(rows)} rows")
          want("page size", meta.get("pages_available") == 15,
               f'totalPages was {meta.get("pages_available")}')

          # The ordering decides WHICH businesses are in the file, so a run
          # whose sort the site quietly ignored is not comparable to
          # yesterday's.
          want("sort applied", meta.get("sort_applied") == "a-z",
               f'asked a-z, site applied {meta.get("sort_applied")!r}')

          # The columns BBB fills on every record. Not rating_grade: 7 of 105
          # captured businesses are genuinely ungraded, so a floor there would
          # fire on healthy data.
          for column in ("title", "url", "sku", "category", "latitude"):
              filled = sum(1 for r in rows if r.get(column) not in (None, "", []))
              share = 100.0 * filled / len(rows)
              print(f"{column}: {filled}/{len(rows)} ({share:.0f}%)")
              want(f"{column} coverage", share >= 99, f"{share:.0f}%")

          # The two traps most likely to come back silently.
          want("no markup in titles",
               not any("<" in (r.get("title") or "") for r in rows),
               "an <em> survived the strip")
          want("no rating_score of 0.0",
               not any(r.get("rating_score") == 0.0 for r in rows),
               "an ungraded business was written through as 0.0")

          # page+position must be unique across pages, or the column is
          # worthless — position restarts at 1 on every page.
          pairs = [(r["page"], r["position"]) for r in rows]
          want("page+position unique", len(set(pairs)) == len(pairs),
               f"{len(pairs) - len(set(pairs))} collisions")
          want("sku unique", len({r["sku"] for r in rows}) == len(rows),
               "duplicate skus")

          graded = sum(1 for r in rows if r.get("rating_grade"))
          print(f"graded by BBB: {graded}/{len(rows)}")
          print(f"BBB reports {meta.get('total_results')} results for this query")

          if failures:
              for line in failures:
                  print(f"::error::{line}")
              sys.exit(1)
          print("All canary assertions passed.")
          PY
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-listing
          path: |
            canary.json
            canary.csv
            canary.meta.json
            canary_page*_debug.html
          if-no-files-found: ignore

  profile:
    name: profile (needs a Scraping Browser secret)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `secrets` is not available in a job-level `if`, so presence is tested
      # here and read in each step's `if`.
      HAVE_CDP: ${{ secrets.BBB_CDP_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Explain the skip
        if: env.HAVE_CDP != 'true'
        run: |
          echo "::notice::Skipping the profile run: no BBB_CDP_ENDPOINT secret is set."
          echo "A business profile page is Cloudflare-gated, and a GitHub runner is a"
          echo "datacenter address, so this half cannot pass without a residential exit."
          echo "The LISTING job above needs no credentials and is the real canary."
          echo ""
          echo "    gh secret set BBB_CDP_ENDPOINT --repo 2scraper/bbb-scraper"
          {
            echo "### Profile canary skipped"
            echo "No \`BBB_CDP_ENDPOINT\` secret. The listing canary covers the parser;"
            echo "this job covers the gated page only."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: env.HAVE_CDP == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: env.HAVE_CDP == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Run
        id: run
        if: env.HAVE_CDP == 'true'
        env:
          # Through the ENVIRONMENT, not a --flag: env_config.py already reads
          # exactly this name, an unset secret arrives as an empty string
          # which the loader treats as unset, and the credential never reaches
          # a command line (§3, §11).
          BBB_CDP_ENDPOINT: ${{ secrets.BBB_CDP_ENDPOINT }}
        run: |
          set +e
          python playwright_scraper.py --mode profile \
            --url "https://www.bbb.org/us/ny/bronx/profile/cleaning-services/proclean-maintenance-systems-inc-0121-134716" \
            --format json --out canary_profile
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check what came back
        if: env.HAVE_CDP == 'true'
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os, sys
          code = int(os.environ["EXIT_CODE"])
          if code == 3:
              # Access, not a regression — and not a failure of this repo.
              print("::warning::Blocked (exit 3). The Scraping Browser profile "
                    "was refused or has expired. Nothing was tested; this is "
                    "access rather than a parser regression.")
              sys.exit(0)
          if code == 5:
              print("::warning::Remote API error (exit 5). If the log says "
                    "'profile_locked', another run still holds this pid — give "
                    "CI its own. Otherwise the secret has expired.")
              sys.exit(0)
          if code != 0:
              print(f"::error::The profile run exited {code}.")
              sys.exit(1)

          rows = json.load(open("canary_profile.json"))
          row = rows[0]
          failures = []
          if len(rows) != 1:
              failures.append(f"expected one row, got {len(rows)}")
          # The columns that exist ONLY on a profile — if these are empty the
          # gated page was fetched and not understood, which is the regression
          # this job exists to catch.
          for column in ("accredited_since", "bbb_file_opened",
                         "years_in_business", "entity_type", "website"):
              if row.get(column) in (None, "", []):
                  failures.append(f"{column} is empty")
          if row.get("data_source") != "profile":
              failures.append(f'data_source is {row.get("data_source")!r}')
          # The join with a listing row is the whole point of rebuilding sku.
          if not row.get("sku", "").startswith("0121_134716_"):
              failures.append(f'sku {row.get("sku")!r} no longer joins a listing row')
          for line in failures:
              print(f"::error::{line}")
          print(json.dumps(row, indent=1)[:1200])
          sys.exit(1 if failures else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always() && env.HAVE_CDP == 'true'
        with:
          name: canary-profile
          path: |
            canary_profile.json
            canary_profile.meta.json
            canary_profile_page*_debug.html
          if-no-files-found: ignore
